# artefakt fork: build the all-in-one image for the Ugreen NAS and publish it
# to GitHub Container Registry as ghcr.io/<owner>/picpeak-artefakt.
#   :latest  – newest build from the artefakt branch
#   :<sha>   – every build, to roll back to an exact version
name: artefakt image

on:
  push:
    branches: [artefakt]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: artefakt-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/picpeak-artefakt" >> "$GITHUB_OUTPUT"
          echo "version=$(git describe --tags --always 2>/dev/null || echo ${GITHUB_SHA::7})-artefakt" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.aio
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
